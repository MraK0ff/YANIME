version: 2.1

# Native CircleCI Android build. GitHub Actions remains responsible for
# GitHub Releases; CircleCI publishes build outputs as CircleCI artifacts.
jobs:
  android-build:
    machine:
      image: android:current
    resource_class: xlarge.gen2
    working_directory: ~/project
    environment:
      TERM: dumb
    steps:
      - checkout

      - restore_cache:
          keys:
            - yanime-gradle-v3-{{ arch }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}
            - yanime-gradle-v3-{{ arch }}-

      - run:
          name: Verify build environment
          command: |
            set -euo pipefail
            java -version
            java_major="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version =/ {print $2; exit}')"
            if [[ "$java_major" != "21" ]]; then
              echo "Expected JDK 21 from the CircleCI Android image, got: $java_major" >&2
              exit 1
            fi
            test -x ./gradlew
            test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            echo "Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - run:
          name: Install required Android SDK platform
          command: |
            set -euo pipefail
            sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            sdkmanager_bin="$(command -v sdkmanager || true)"
            if [[ -z "$sdkmanager_bin" ]]; then
              sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
            fi
            test -x "$sdkmanager_bin"

            compile_sdk="$(grep -m1 '^android-compileSdk' gradle/libs.versions.toml | cut -d'"' -f2)"
            minor_sdk="$(grep -m1 '^android-compileSdkMinor' gradle/libs.versions.toml | cut -d'"' -f2 || true)"
            platform_version="$compile_sdk"
            if [[ -n "$minor_sdk" && "$minor_sdk" != "0" ]]; then
              platform_version="$compile_sdk.$minor_sdk"
            fi

            yes | "$sdkmanager_bin" --licenses >/dev/null || true
            "$sdkmanager_bin" --install "platforms;android-$platform_version"
            echo "Installed Android platform $platform_version"

      - run:
          name: Configure YummyTV API base URL
          command: |
            set -euo pipefail
            api_base_url="${YUMMY_TV_API_BASE_URL:-https://v2.yummytv.afk.su/api}"
            if [[ ! "$api_base_url" =~ ^https:// ]]; then
              echo "YUMMY_TV_API_BASE_URL must be an HTTPS URL" >&2
              exit 1
            fi
            printf 'yummytv.apiBaseUrl=%s\n' "$api_base_url" >> local.properties

      - run:
          name: Build optimized debug APK
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            free -h
            ./gradlew :app:assembleReleaseDebug --stacktrace --profile --build-cache

      - run:
          name: Sign and verify APK with Android test key
          command: |
            set -euo pipefail
            key_dir="/tmp/yanime-android-testkey"
            mkdir -p "$key_dir"

            curl -fsSL --retry 3 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT' |
              base64 --decode > "$key_dir/testkey.pk8"
            curl -fsSL --retry 3 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT' |
              base64 --decode > "$key_dir/testkey.x509.pem"

            openssl pkcs8 -inform DER -nocrypt -in "$key_dir/testkey.pk8" -out /dev/null
            openssl pkey -inform DER -in "$key_dir/testkey.pk8" -pubout -out "$key_dir/key-public.pem"
            openssl x509 -in "$key_dir/testkey.x509.pem" -pubkey -noout > "$key_dir/cert-public.pem"
            diff -u "$key_dir/key-public.pem" "$key_dir/cert-public.pem"

            sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
            test -n "$apksigner"

            shopt -s nullglob
            apks=(app/build/outputs/apk/releaseDebug/*.apk)
            test "${#apks[@]}" -gt 0
            for apk in "${apks[@]}"; do
              "$apksigner" sign --key "$key_dir/testkey.pk8" --cert "$key_dir/testkey.x509.pem" "$apk"
              "$apksigner" verify --verbose --print-certs "$apk"
            done

            test -f app/build/outputs/apk/releaseDebug/YANIME.apk

      - run:
          name: Prepare optional diagnostic artifacts
          command: |
            set -euo pipefail
            artifact_root="ci-artifacts"
            mkdir -p "$artifact_root/r8-mappings" "$artifact_root/gradle-build-profile" "$artifact_root/room-schema"

            if [[ -d app/mappings ]]; then
              find app/mappings -type f -name mapping.txt -exec cp {} "$artifact_root/r8-mappings/" \; || true
            fi
            if [[ -d build/reports/profile ]]; then
              find build/reports/profile -type f -name '*.html' -exec cp {} "$artifact_root/gradle-build-profile/" \; || true
            fi
            schema="core/storage/schemas/su.afk.yummy.tv.core.storage.db.AppDatabase/71.json"
            if [[ -f "$schema" ]]; then
              cp "$schema" "$artifact_root/room-schema/71.json"
            fi

      - save_cache:
          key: yanime-gradle-v3-{{ arch }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_artifacts:
          path: app/build/outputs/apk/releaseDebug/YANIME.apk
          destination: YANIME.apk

      - store_artifacts:
          path: ci-artifacts/r8-mappings
          destination: r8-mappings

      - store_artifacts:
          path: ci-artifacts/gradle-build-profile
          destination: gradle-build-profile

      - store_artifacts:
          path: ci-artifacts/room-schema
          destination: room-schema

workflows:
  build:
    jobs:
      - android-build
