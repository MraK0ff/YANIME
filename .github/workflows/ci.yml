name: YANIME CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

# Keep only the newest non-main run for each branch/PR.
# Main runs are not cancelled: release publishing must finish atomically.
concurrency:
  group: yanime-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect build-relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_build: ${{ steps.filter.outputs.run_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # Manual runs and initial pushes always build.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If Git cannot resolve the comparison safely, prefer a build over a false skip.
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "::warning::Could not fetch base commit; running the Android build."
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"; then
            echo "::warning::Could not calculate changed paths; running the Android build."
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 <<'PY'
          import os
          from pathlib import PurePosixPath

          with open(os.environ["RUNNER_TEMP"] + "/changed-paths", "rb") as stream:
              paths = [item.decode("utf-8", "surrogateescape") for item in stream.read().split(b"\0") if item]

          build_roots = (
              "app/", "core/", "feature/", "source/", "external/",
              "baselineprofile/", "private/", "buildSrc/", "build-logic/",
              "gradle/", "scripts/", "tools/", ".github/workflows/",
              ".github/actions/", ".github/scripts/",
          )
          build_files = {
              "gradlew", "gradlew.bat", "gradle.properties",
              "settings.gradle", "settings.gradle.kts",
              "build.gradle", "build.gradle.kts", ".gitmodules", ".gitattributes",
          }
          docs_only_roots = (
              "docs/", ".github/ISSUE_TEMPLATE/", ".circleci/",
          )
          docs_only_files = {
              ".github/FUNDING.yml", ".github/CODEOWNERS",
          }

          run_build = False
          for path in paths:
              name = PurePosixPath(path).name
              if path in docs_only_files or path.startswith(docs_only_roots):
                  continue
              if path.startswith(build_roots) or path in build_files:
                  run_build = True
                  break
              if name.endswith((".gradle", ".gradle.kts")):
                  run_build = True
                  break
              if name.startswith(("README", "LICENSE", "NOTICE", "CONTRIBUTING")):
                  continue

              # Unknown files are build-relevant by default (fail-safe).
              print(f"Unknown changed path; keeping build enabled: {path}")
              run_build = True
              break

          print(f"Changed files: {len(paths)}")
          print(f"Android build required: {run_build}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_build={'true' if run_build else 'false'}\n")
          PY

  build:
    name: Build optimized APK
    needs: changes
    if: needs.changes.outputs.run_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version_name: ${{ steps.app_version.outputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Fork PRs may restore the cache but cannot write to it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          compile_sdk=$(grep -m1 '^android-compileSdk' gradle/libs.versions.toml | cut -d'"' -f2)
          case "$compile_sdk" in
            *.*) platform_version="$compile_sdk" ;;
            *)   platform_version="$compile_sdk.0" ;;
          esac
          echo "compileSdk=$compile_sdk -> platforms;android-$platform_version"
          (yes || true) | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-$platform_version"

      - name: Configure YummyTV API base URL
        env:
          API_BASE_URL: ${{ vars.YUMMY_TV_API_BASE_URL || 'https://v2.yummytv.afk.su/api' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$API_BASE_URL" =~ ^https:// ]]; then
            echo "::error::YUMMY_TV_API_BASE_URL must be an HTTPS URL"
            exit 1
          fi
          printf 'yummytv.apiBaseUrl=%s\n' "$API_BASE_URL" >> local.properties
          echo "Configured YummyTV API base URL."

      # assembleReleaseDebug already compiles Kotlin; a separate compile task
      # only starts Gradle twice without providing additional build coverage.
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner memory before Gradle:"
          free -h
          ./gradlew :app:assembleReleaseDebug --stacktrace --profile --build-cache

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: yanime-r8-mapping
          path: app/mappings/**/releaseDebug/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload Gradle build profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-profile
          path: build/reports/profile/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload generated Room schema
        uses: actions/upload-artifact@v7
        with:
          name: room-schema-71
          path: core/storage/schemas/su.afk.yummy.tv.core.storage.db.AppDatabase/71.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Re-sign APK with the standard Android testkey
        shell: bash
        run: |
          set -euo pipefail

          key_dir="$RUNNER_TEMP/android-testkey"
          mkdir -p "$key_dir"

          curl -fsSL --retry 3 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT' \
            | base64 --decode > "$key_dir/testkey.pk8"
          curl -fsSL --retry 3 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT' \
            | base64 --decode > "$key_dir/testkey.x509.pem"

          openssl pkcs8 -inform DER -nocrypt -in "$key_dir/testkey.pk8" -out /dev/null
          openssl pkey -inform DER -in "$key_dir/testkey.pk8" -pubout -out "$key_dir/key-public.pem"
          openssl x509 -in "$key_dir/testkey.x509.pem" -pubkey -noout > "$key_dir/cert-public.pem"
          diff -u "$key_dir/key-public.pem" "$key_dir/cert-public.pem"

          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"

          shopt -s nullglob
          apks=(app/build/outputs/apk/releaseDebug/*.apk)
          test "${#apks[@]}" -gt 0

          for apk in "${apks[@]}"; do
            "$apksigner" sign --key "$key_dir/testkey.pk8" --cert "$key_dir/testkey.x509.pem" "$apk"
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(jq -er '.elements[0].versionName | select(type == "string" and length > 0)' app/build/outputs/apk/releaseDebug/output-metadata.json)"
          [[ "$version_name" =~ ^[0-9A-Za-z._+-]+$ ]]
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Verify static APK filename
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/releaseDebug/YANIME.apk

      - name: Upload optimized APK
        uses: actions/upload-artifact@v7
        with:
          name: yanime-apk
          path: app/build/outputs/apk/releaseDebug/YANIME.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish versioned YANIME release
    needs: [changes, build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.run_build == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release history generator
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download latest APK
        uses: actions/download-artifact@v7
        with:
          name: yanime-apk
          path: release-apk

      - name: Remove legacy release tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for legacy_tag in latest v; do
            if gh release view "$legacy_tag" >/dev/null 2>&1; then
              gh release delete "$legacy_tag" --yes
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$legacy_tag" >/dev/null 2>&1 || true
          done

      - name: Publish versioned YANIME release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version_name }}
          name: ${{ needs.build.outputs.version_name }}
          target_commitish: main
          make_latest: true
          prerelease: false
          draft: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-apk/YANIME.apk

      - name: Update automatic release history
        env:
          GH_TOKEN: ${{ github.token }}
          YANIME_VERSION: ${{ needs.build.outputs.version_name }}
        run: python3 .github/scripts/update_release_history.py
